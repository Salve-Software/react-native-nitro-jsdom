name: Run React Native Harness Android

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/harness-android.yml'
      - 'example/**'
      - 'cpp/**'
      - 'src/**'
      - 'nitrogen/**'
      - 'android/**'
      - 'package.json'
      - 'yarn.lock'
      - 'react-native.config.js'
      - 'nitro.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Android Harness
    runs-on: ubuntu-latest
    # KVM-backed emulators on GitHub-hosted runners only support x86_64 — the
    # arm64-v8a build used by android-build.yml can't boot in an emulator here.
    env:
      DEVICE_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Get yarn cache dir
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('cpp/**', 'packages/lexbor/**', 'packages/quickjs/**') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Build Android app
        working-directory: example/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ env.DEVICE_ARCH }}
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Run React Native Harness
        uses: callstackincubator/react-native-harness@v1.2.0
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android
          projectRoot: example
          packageManager: yarn

      - name: Stop Gradle daemon
        if: always()
        working-directory: example/android
        run: ./gradlew --stop
